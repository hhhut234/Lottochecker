name: 당첨번호 갱신

# 토요일 추첨(20:35) 뒤와 일요일 아침에 새 회차를 받아 data.json 을 갱신한다.
on:
  schedule:
    - cron: "30 12 * * 6"   # 토 21:30 (한국 시간)
    - cron: "0 0 * * 0"     # 일 09:00 (한국 시간) — 토요일에 못 받았을 때 대비
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 당첨번호 받기
        run: python update_data.py
      - name: 바뀌었으면 저장
        run: |
          if git diff --quiet -- data.json; then
            echo "새 회차 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "당첨번호 갱신"
            git push
          fi
